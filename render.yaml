# Render Blueprint Specification for SentinelAI Full-Stack Architecture
# Repository Root Blueprint for automated cloud deployment
services:
  - type: web
    name: sentinelai-backend
    runtime: python
    rootDir: src/backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: SentinelAI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: "https://sentinel-ai-ibm-bob.vercel.app"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.(vercel\\.app|onrender\\.com|netlify\\.app|pages\\.dev)"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://sentinel-ai-ibm-bob.vercel.app"
      - key: ADMIN_EMAIL
        value: "sentinelai712@gmail.com"
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$A0XvgK4RCBVt.FxxPWoSxenOJ2GbEGAwOtJ7pc1pII0AODD4d84KW"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: IBM_BOB_API_KEY
        sync: false
      - key: IBM_BOB_MODEL
        value: "ibm/granite-3-8b-instruct"
