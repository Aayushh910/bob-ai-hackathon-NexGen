submission:
  title: "SentinelAI - Mission Readiness & Predictive Maintenance Copilot" # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Military maintenance teams struggle to accurately determine whether aircraft,
    vehicles, and critical equipment are truly mission-ready because maintenance
    decisions often rely on fixed schedules and manually analyzed sensor and
    service data. The project helps maintenance and operations teams detect early
    signs of component failure, understand readiness risks, and prioritize
    maintenance before unexpected failures impact mission availability.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    SentinelAI is an AI-powered copilot that ingests real-time sensor telemetry
    and historical maintenance records to assess mission readiness, detect
    anomalies, and predict potential component failures. It combines predictive
    analytics with IBM watsonx.ai and a LangChain-based reasoning layer to
    explain risks in natural language and generate a prioritized maintenance plan
    before failures affect mission availability.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-time sensor anomaly detection"
    - "Predictive failure and risk analysis"
    - "AI-powered explainability with prioritized maintenance recommendations"

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

